<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1f1216"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open When…</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;1,400&family=Pinyon+Script&family=Special+Elite&family=Poppins:ital,wght@1,600&family=Caveat:wght@500&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f4eee8; --bg2:#e4d8cf; --sub:#7a5a60;
  --paper:#fbf4e6; --paper2:#eadcc3; --gold:#b5935a; --wine:#5a2330; --ink:#33211f; --wax:#8f2f38; --focus:#5a2330;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#341f27;--bg2:#1f1216;--sub:#bfa9a8;--focus:#dcc7a0}
}
:root[data-theme="dark"]{--bg1:#341f27;--bg2:#1f1216;--sub:#bfa9a8;--focus:#dcc7a0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg2)}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow-x:hidden;color:var(--ink);font-family:"EB Garamond",Georgia,serif;
  background:radial-gradient(ellipse 120% 80% at 50% 0%,var(--bg1),var(--bg2) 75%) fixed}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 36px;text-align:center}
.orn{color:var(--gold);font-size:22px;line-height:1}
.sub{color:var(--sub);margin:8px 0 56px;font-size:19px;font-style:italic}

/* deck of envelopes */
.deck{position:relative;width:min(86vw,360px);aspect-ratio:3/2.4;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:0;background:var(--paper);border-radius:3px;cursor:grab;transform-origin:50% 100%;
  box-shadow:0 18px 30px -16px rgba(0,0,0,.7);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s;outline:none}
.card:active{cursor:grabbing}
.card:focus-visible{box-shadow:0 0 0 3px var(--focus),0 18px 30px -16px rgba(0,0,0,.7)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:50%;background:linear-gradient(var(--paper),var(--paper2));clip-path:polygon(0 0,100% 0,50% 100%);border-radius:3px 3px 0 0}
.card::after{content:"";position:absolute;inset:7px;border:1px solid var(--gold);opacity:.55;pointer-events:none}
.post{position:absolute;top:16px;right:18px;width:24px;height:30px;border:1.5px dashed var(--gold);display:grid;place-items:center;color:var(--wax);font-size:12px;z-index:2}
.seal,.wax{background:radial-gradient(circle at 35% 30%,#a8404a,var(--wax) 60%,#5e1a22);box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.1);
  color:rgba(58,6,14,.62);text-shadow:0 1px 0 rgba(255,255,255,.28),0 -1px 0 rgba(0,0,0,.35);display:grid;place-items:center;border-radius:50%;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:16px;letter-spacing:.02em}
.seal::before,.wax::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(58,6,14,.35);box-shadow:0 1px 0 rgba(255,255,255,.2)}
.seal::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:repeating-conic-gradient(rgba(58,6,14,.6) 0 1.4deg,transparent 1.4deg 9deg);-webkit-mask:radial-gradient(circle closest-side,transparent 0 78%,#000 80%);mask:radial-gradient(circle closest-side,transparent 0 78%,#000 80%);opacity:0;transition:opacity .4s}
.card.dial .seal::after{opacity:1}
.card.dial .seal{animation:dial 2.4s both}
@keyframes dial{0%{transform:translate(-50%,-50%) rotate(0deg);animation-timing-function:ease-in-out}38%{transform:translate(-50%,-50%) rotate(430deg) scale(1.05);animation-timing-function:ease-in-out}66%{transform:translate(-50%,-50%) rotate(150deg) scale(1.05);animation-timing-function:ease-in-out}100%{transform:translate(-50%,-50%) rotate(360deg) scale(1)}}
.ov.on{animation:fadein .4s}
@keyframes fadein{from{opacity:0}}
.seal{position:absolute;top:47%;left:50%;width:50px;height:50px;transform:translate(-50%,-50%);z-index:2;transition:.3s}

.txt{position:absolute;left:0;right:0;bottom:9%;z-index:2;line-height:1}
.ow{display:block;font-family:"Pinyon Script",cursive;font-size:36px;color:var(--wine)}
.lb{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:27px;color:var(--wine);margin-top:2px}
.dots{margin-top:44px;line-height:1}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid var(--gold);margin:0 4px;transition:.3s}
.dots i.on{background:var(--gold)} .dots i.cur{width:20px;border-radius:4px}
.hint{color:var(--sub);font-style:italic;font-size:17px;margin:14px 0 0}
.again{border:0;background:none;color:var(--sub);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer;margin-top:8px}

/* opening scene */
.ov{position:fixed;inset:0;background:rgba(22,8,12,.86);display:none;z-index:30;align-items:center;justify-content:center;padding:18px;touch-action:none;overscroll-behavior:contain}
.ov.on{display:flex}
.scene{position:relative;width:min(86vw,360px);aspect-ratio:3/2.4;perspective:1000px}
.scene>*{position:absolute}
.body{inset:0;background:var(--paper2);border-radius:3px;box-shadow:0 24px 44px -10px rgba(0,0,0,.7);z-index:1}
.sheet{left:7%;right:7%;top:6%;bottom:4%;background:var(--paper);z-index:2;background-image:none}
.front{inset:0;background:linear-gradient(160deg,var(--paper),var(--paper2));clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:3}
.flap{left:0;right:0;top:0;height:56%;background:linear-gradient(var(--paper),var(--paper2));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;z-index:4}
.wax{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);width:46px;height:46px}
.scene.open .flap{animation:flip 1.4s ease-in-out forwards}
.scene.open .wax{animation:crack .6s ease-out forwards}
.scene.rise .sheet{transform:translateY(-64%);transition:transform 1.8s cubic-bezier(.3,.6,.2,1)}
@keyframes flip{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{z-index:0}100%{transform:rotateX(180deg);z-index:0}}
@keyframes crack{30%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.08)}100%{opacity:0;transform:translate(-50%,-50%) rotate(14deg) scale(1.35)}}
.ov.reading .scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity 1s ease}

/* letter */
.letter{display:none;position:relative;width:100%;max-width:420px;max-height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:var(--paper);color:var(--ink);text-align:center;
  padding:30px 24px 20px;border-radius:2px;box-shadow:inset 0 0 0 9px var(--paper),inset 0 0 0 10px var(--gold),0 30px 60px -20px rgba(0,0,0,.7)}
.ov.reading .letter{display:block;animation:in 1.1s cubic-bezier(.2,.8,.2,1)}


.ov.reading .letter.hit{animation:hit .22s}
.letter.scroll{overflow:auto;touch-action:pan-y;overscroll-behavior:contain}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
@keyframes hit{40%{transform:translateY(3px) scale(.994)}}
.x{position:absolute;top:16px;right:18px;border:0;background:none;color:var(--sub);font-size:28px;line-height:1;cursor:pointer;padding:4px 8px;z-index:2}
.x:focus-visible,.pol:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.pol{position:relative;width:36%;margin:2px auto 16px;background:#fffdf8;padding:9px 9px 10px;box-shadow:0 8px 18px -8px rgba(0,0,0,.55);transform:rotate(-2deg);cursor:pointer}
.pol::before{content:"";position:absolute;top:-12px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(181,147,90,.4);transform:rotate(3deg)}
.ph{aspect-ratio:1;background:var(--paper2);display:grid;place-items:center;overflow:hidden;color:var(--sub);font-size:15px;font-style:italic;line-height:1.3}
.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.22) contrast(.96) saturate(.9)}
.ph span{display:block;font-size:24px;color:var(--wax);font-style:normal}
.cap{font-family:"Pinyon Script",cursive;color:var(--wine);font-size:23px;margin-top:4px;line-height:1.2}
.letter h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;color:var(--wine);font-size:26px;margin:0;line-height:1.2}
.letter .orn{margin:4px 0 8px}
.letter p{font-size:18.5px;line-height:1.55;margin:0;white-space:pre-line}

/* blue government-style stamp */
.stampwrap{display:flex;justify-content:flex-end;margin-top:2px;padding:10px 4px 0 0}
.stamp{color:#27479c;mix-blend-mode:multiply;opacity:0}
.stamp.go{animation:thump .55s cubic-bezier(.3,1.3,.5,1) forwards}
.stamp.now{opacity:.92;transform:rotate(-7deg)}
@keyframes thump{0%{opacity:0;transform:scale(2.4) rotate(-22deg)}55%{opacity:.95;transform:scale(.93) rotate(-7deg)}100%{opacity:.92;transform:scale(1) rotate(-7deg)}}
.ink{filter:url(#ink);border:3px double currentColor;border-radius:3px;padding:4px 9px 4px;display:flex;flex-direction:column;gap:2px;font-family:"Special Elite",ui-monospace,monospace;text-transform:uppercase}
.ink small{font-size:8.5px;letter-spacing:.12em}
.ink b{font-size:20px;letter-spacing:.1em;line-height:1;font-weight:400}
.ink em{font-style:normal;font-size:8.5px;letter-spacing:.18em;border-top:1.2px solid currentColor;padding-top:2px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.ov.reading .letter{animation:none}.enter main>*{animation:none}}
.ov.on.closing{animation:fadeout .7s .2s ease forwards}
.ov.reading.closing .letter{animation:out .8s cubic-bezier(.5,0,.75,.5) forwards}
@keyframes out{to{opacity:0;transform:translateY(70px) scale(.9)}}
@keyframes fadeout{to{opacity:0}}
.card.relock .seal{animation:relock .8s ease-out}
@keyframes relock{0%{transform:translate(-50%,-50%) rotate(-50deg) scale(1.07)}60%{transform:translate(-50%,-50%) rotate(6deg) scale(1.03)}100%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}}

/* intro */
.intro{position:fixed;inset:0;z-index:50;background:var(--bg2);display:grid;place-items:center;padding:24px;text-align:center;color:#5a2330;cursor:pointer;touch-action:none;transition:opacity 1s ease}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .intro{color:#dcc7a0;--ic:#dcc7a0}}
:root[data-theme="dark"] .intro{color:#dcc7a0;--ic:#dcc7a0}
.intro.out{opacity:0;pointer-events:none}
.intro>*{grid-area:1/1}
.hbox{transition:opacity .8s ease}
.hbox.gone{opacity:0}
.heart{display:block;width:min(48vw,210px);height:auto;overflow:visible}
.heart path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1}
.heart .p1{stroke-width:2.4}
.heart .p2{stroke-width:1.3;opacity:.55}
.heart.draw .p1{animation:draw 2.2s cubic-bezier(.45,0,.3,1) forwards}
.heart.draw .p2{animation:draw 2.4s .5s cubic-bezier(.45,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.h2wrap{margin-top:30px;display:flex;justify-content:center}
.h2wrap .heart{width:min(30vw,120px)}
.intro.zoom .box{transform:scale(30);opacity:0;transition:transform 1.6s cubic-bezier(.65,0,.95,.45),opacity .8s .7s ease}
.zin.enter main>*{animation-name:zin}
@keyframes zin{from{opacity:0;transform:scale(.9)}}
.pre{display:inline-block;overflow:hidden;white-space:pre;vertical-align:top;transition:max-width 1s ease,opacity .7s ease}
.intro .l1{transition:height 1s ease,opacity .7s ease}
.intro .l2{transition:margin-top 1s ease}
#t2.ret .nm::after{transform-origin:right center}
.intro .box{transition:opacity .8s ease}
.intro.fade .box{opacity:0}
.intro .line{min-height:1.25em}
.intro .l1{font-family:"Poppins",system-ui,sans-serif;font-style:italic;font-weight:600;font-size:clamp(24px,7vw,38px);letter-spacing:.01em}
.intro .l2{margin-top:8px;font-family:"Poppins",system-ui,sans-serif;font-style:italic;font-weight:600;font-size:clamp(24px,7vw,38px);letter-spacing:.01em}
.tx{display:inline-block;min-height:1.15em;vertical-align:top;position:relative}
.nm{position:relative;display:inline-block}
.nm::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;background:currentColor;opacity:.85;transform:scaleX(0);transform-origin:left center;transition:transform 1.1s cubic-bezier(.65,0,.25,1)}
#t2.under .nm::after{transform:scaleX(1)}

@keyframes blink{50%{border-right-color:transparent}}
.intro-on main>*{opacity:0}
.enter main>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
.enter main>:nth-child(2){animation-delay:.12s}
.enter main>:nth-child(3){animation-delay:.28s}
.enter main>:nth-child(4){animation-delay:.6s}
.enter main>:nth-child(5){animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.letter p{font-family:"Caveat","EB Garamond",cursive;font-size:23px;line-height:1.3}
.pm{position:absolute;top:13px;right:36px;width:48px;height:48px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font:8px/1.15 "Special Elite",monospace;text-align:center;color:rgba(90,35,48,.5);transform:rotate(-14deg);z-index:2;letter-spacing:.03em}
.pm::after{content:"";position:absolute;left:100%;top:14px;width:34px;height:20px;background:repeating-linear-gradient(to bottom,currentColor 0 1.4px,transparent 1.4px 6px)}
.card.locked .seal{filter:saturate(.45) brightness(.88)}
.card.locked .ow::after{content:" \00b7 locked";font:italic 15px "EB Garamond",serif}
.card.grab .seal::after{opacity:1}
.card.nope{animation:nope .45s}
@keyframes nope{25%{translate:-7px 0}75%{translate:7px 0}}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--wine);color:var(--paper);padding:10px 18px;border-radius:999px;font:italic 16px "EB Garamond",serif;opacity:0;pointer-events:none;transition:.4s;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.extra{margin:14px 0 0}.extra:empty{display:none}
.coupon{display:inline-block;border:2px dashed var(--gold);padding:8px 16px;font-family:"Special Elite",monospace;font-size:13px;letter-spacing:.06em;color:var(--wine);text-transform:uppercase;background:rgba(181,147,90,.12)}
.coupon b{display:block;font-weight:400;font-size:10px;opacity:.7}
.extra a{color:var(--wine);border-bottom:1px solid var(--gold);font-style:italic;font-size:18px;text-decoration:none}
.extra audio{width:100%;max-width:260px;height:36px}
.gate{position:fixed;inset:0;z-index:60;background:var(--bg2);display:grid;place-items:center;text-align:center;color:var(--sub);font:italic 600 20px "Poppins",system-ui,sans-serif;cursor:pointer;transition:opacity .6s;padding:24px}
.h2wrap{position:relative;min-height:108px;align-items:center}
.pwbox{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;opacity:0;pointer-events:none;transition:opacity .7s;z-index:3}
.pwbox.show{opacity:1;pointer-events:auto}
.pwbox input{font:italic 600 18px "Poppins",system-ui,sans-serif;text-align:center;letter-spacing:.2em;padding:10px 16px;border:1.5px solid currentColor;border-radius:999px;background:transparent;color:inherit;width:min(64vw,230px);outline:none}
.pwbox input::placeholder{letter-spacing:.05em;opacity:.55}
.pwbox button{font:italic 600 15px "Poppins",system-ui,sans-serif;color:inherit;background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:8px 28px;margin-top:12px;cursor:pointer}
.pwbox small{font:italic 500 13px "Poppins",system-ui,sans-serif;min-height:1.2em;margin-top:8px;opacity:.85}
.pwbox.nope{animation:nope .45s}
.cd{display:none;font:italic 15px "EB Garamond",serif;color:var(--sub);margin-top:5px;letter-spacing:.02em}
.card.locked .cd{display:block}.cd:empty{display:none!important}
.songs{margin-top:8px;text-align:left}
.extra .song{display:flex;gap:12px;align-items:baseline;padding:9px 2px;border-bottom:1px solid rgba(181,147,90,.45);color:inherit;text-decoration:none;font-style:normal;font-size:inherit;font-family:"EB Garamond",serif}
.song i{font-style:normal;color:var(--gold);width:1.2em}
.song b{display:block;font-weight:600;font-size:18px;color:var(--wine)}
.song em{display:block;font-size:15px;color:var(--sub)}
.extra a.song::after{content:"\2197";margin-left:auto;color:var(--gold)}
.wallet{margin-top:10px;text-align:left}
.tkt{position:relative;display:flex;gap:10px;align-items:center;justify-content:space-between;border:1.5px dashed var(--gold);border-radius:4px;padding:10px 12px;margin-bottom:10px;background:rgba(181,147,90,.1)}
.tkt .tl{flex:1;min-width:0}
.tkt b{display:block;font-family:"EB Garamond",serif;font-weight:600;font-size:17px;line-height:1.2;color:var(--wine)}
.tkt em{display:block;font-style:italic;font-size:14px;color:var(--sub)}.tkt em:empty{display:none}
.tkt input{width:100%;margin-top:6px;font:italic 16px "EB Garamond",serif;border:0;border-bottom:1px solid var(--gold);background:transparent;color:var(--ink);padding:4px 2px;outline:none}
.tkt button{font:italic 600 14px "EB Garamond",serif;color:var(--wine);background:transparent;border:1.5px solid var(--wine);border-radius:999px;padding:6px 14px;cursor:pointer;max-width:110px}
.tkt.done{opacity:.8}.tkt.done button{display:none}
.tkt.done::after{content:"REDEEMED";position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(-9deg);color:#27479c;border:2px double #27479c;padding:3px 8px;font:11px "Special Elite",monospace;letter-spacing:.12em;mix-blend-mode:multiply;filter:url(#ink)}
.tkt{overflow:hidden}
.scr{position:absolute;inset:0;width:100%;height:100%;border-radius:4px;touch-action:none;cursor:crosshair;transition:opacity .6s;z-index:2}
.scr.gone{opacity:0;pointer-events:none}
.wallet .cool{margin:0 0 10px;font-style:italic;font-size:15px;color:var(--sub);text-align:center}.wallet .cool:empty{display:none}
.lb.long{font-size:22px}
#lb.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:18px;line-height:1.95;text-align:right}
.letter p.sign{font-family:"Aref Ruqaa","Amiri",serif;font-size:24px;line-height:1.5;color:var(--wine);margin-top:18px;text-align:center;direction:rtl}
.letter p.sign:empty{display:none}
.ov.reading .letter{display:flex;flex-direction:column;height:min(100%,640px)}
.pgwrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}
.head,.foot{flex:none}
.bodyw{flex:none;position:relative}
#bodyw{flex:none;position:relative}
.nav{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;height:34px;padding-top:6px}
.nav.one{display:none}
.nav button{border:0;background:none;color:var(--wine);font-size:28px;line-height:1;cursor:pointer;padding:0 10px}
.nav button:disabled{opacity:.25;cursor:default}
.pdots i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid var(--gold);margin:0 3px}
.pdots i.on{background:var(--gold)}
</style>
</head>
<body>
<div class="gate" id="gate"><div><p id="gtxt">Tap to begin</p></div></div>

ايا دي و بجد انتي لو اي حد تاني غيرك كان زمانه زهق و مسك الفوطة رماها من اول اسبوعين بس انتي لا انتي لسة موجودة معايا و جنبي و يارب تفضلي موجودة لحد اخر عمري عشان ده الهدف الرئيسي دلوقتي انك تفضلي معايا بس متسبنيش و تمشي و كل الي بعد كدة بقى ربنا يسهلنا الامور بس الاهم دلوقتي انك تفضلي جنبي و معايا يا جنى . و عموماً يا جنى انا حابب اوي العيشة معاكي يعني انا مبسوط فوق ما انتي تتخيلي اني مشارك حياتي دي معاكي و عمري ما جيت احكيلك حاجة و لقيتك مش مهتمة مثلا فا قفلتيني او كدة لا بالعكس ببقى عارف ان الحاجة دي مش اهتمامك في العموم بس بتقعدي تسمعيني كأن دي اكتر حاجة انتي مهتمة بيها في حياتك و دي بجد حاجة تحفة و انا معرفش بتكلم في ده ليه انتي المفروض متضايقة منييي دلوقتي فا انا اسفففف و عمر ما كان قصدي اني ازعلك بالعكس انا من اول يوم لحد اخر يوم هفضل اسعى بس ف اني احاول اخليكي اسعد واحدة في العالم كله عشان ولله العظيم انا مهما عملت او مهما روحت و جيت هفضل مستني احس بس انك مبسوطة عشان اعرف ابقى مبسوط بقى انا كمان و بس يعني انا اسف تاني و تالت و عاشر لو انا ضايقتك في اي حاجة.", sign:"اوعي تزعلي مني عشان انا مليش غيرك يا جنى❤️"},

let AC=null;
function tick(f,d,v){if(!AC)return;try{d=(d||.025)*1.6;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type=(f||1500)<300?'sine':'triangle';o.frequency.value=(f||1500)>=300?(f||1500)*.5:f;lp.type='lowpass';lp.frequency.value=900;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime((v||.04)*.3,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(lp);lp.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
let NB=null;
function keytap(){if(!AC)return;try{if(!NB){NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.04),AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length)}const s=AC.createBufferSource(),lp=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=NB;lp.type='lowpass';lp.frequency.value=700+Math.random()*300;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05+Math.random()*.02,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(lp);lp.connect(g);g.connect(AC.destination);s.start(t)}catch(e){}}

function typeIntro(){

  sp[0].classList.add('typing');
  (function step(){
    const line=INTRO_LINES[li];
    if(ci<line.length){
      setLine(li,line.slice(0,ci+1));keytap();const ch=line[ci];ci++;

  const box=$('pwbox'),inp=$('pw'),err=$('gerr');
  box.classList.add('show');
  const check=()=>{
    const dg=inp.value.replace(/\D/g,'');if(dg&&(dg===PASSWORD.replace(/\D/g,'')||PASSWORD_ALT.includes(dg))){
      unlocked=true;box.classList.remove('show');inp.blur();tick(700,.06,.12);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
      setTimeout(done,600);
    }else{err.textContent='Not quite, try again';inp.value='';box.classList.remove('nope');void box.offsetWidth;box.classList.add('nope')}
  };
  $('go').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
  setTimeout(()=>inp.focus({preventScroll:true}),700);
}
function askStage(fast){
  askStarted=true;
  const t2=$('t2'),l1=$('t1').parentNode,l2=t2.parentNode,pre=t2.querySelector('.pre');
  const h2=$('heart2'),Q=Array.from(", let's start");
  const q=document.createElement('span');q.className='q';
  const go=()=>{h2.classList.add('draw');T(zoomIn,3500)};
  const proceed=()=>{if(unlocked)go();else showPw(go)};
  if(fast){t2.innerHTML='<span class="nm">Janaa</span>';t2.appendChild(q);q.textContent=Q.join('');l1.style.display='none';l2.style.marginTop='0px';proceed();return}
  t2.appendChild(q);
  if(reduce){pre.style.display='none';l1.style.display='none';q.textContent=Q.join('');proceed();return}
  t2.classList.remove('under');t2.classList.add('ret');
  l1.style.minHeight='0';l1.style.overflow='hidden';l1.style.height=l1.offsetHeight+'px';pre.style.maxWidth=pre.offsetWidth+'px';
  void l1.offsetWidth;
  T(()=>{pre.style.maxWidth='0px';pre.style.opacity='0';l1.style.height='0px';l1.style.opacity='0';l2.style.marginTop='0px'},700);
  T(()=>{
    let k=0;
    (function s(){
      if(k<Q.length){k++;q.textContent=Q.slice(0,k).join('');keytap();const c=Q[k-1];T(s,c===','?280:c===' '?110:65+Math.random()*70)}
      else T(proceed,600)
    })();
  },2000);
}
function zoomIn(){
  if(reduce){endIntro();return}
  if(!unlocked||introDone)return;introDone=true;introTimers.forEach(clearTimeout);
  try{if(location.hash!=='#letters')location.hash='letters'}catch(e){}
  const box=intro.querySelector('.box'),b=box.getBoundingClientRect(),h=$('heart2').getBoundingClientRect();
  box.style.transformOrigin=(h.left+h.width/2-b.left)+'px '+(h.top+h.height/2-b.top)+'px';
  intro.classList.add('zoom');
  setTimeout(()=>intro.classList.add('out'),700);
  setTimeout(()=>{document.body.classList.remove('intro-on');document.body.classList.add('zin','enter')},800);
  setTimeout(()=>{intro.remove();startNudge()},2100);
}
intro.addEventListener('click',()=>{if(unlocked)endIntro();else if(!askStarted){introTimers.forEach(clearTimeout);introTimers=[];hbox.classList.add('gone');askStage(true)}});
addEventListener('hashchange',()=>{if(location.hash==='#letters')endIntro();else if(introDone)location.reload()});
const heart=$('heart'),hbox=$('hbox');
function beginIntro(){
if(location.hash==='#letters'&&!PASSWORD){intro.remove();introDone=true;document.body.classList.remove('intro-on');document.body.classList.add('enter');setTimeout(startNudge,900)}
else if(reduce){hbox.classList.add('gone');introTimers.push(setTimeout(typeIntro,700))}
else{introTimers.push(setTimeout(()=>heart.classList.add('draw'),400),setTimeout(()=>hbox.classList.add('gone'),3500),setTimeout(typeIntro,4200))}
}
const gate=$('gate');
function openGate(){
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  gate.style.opacity=0;setTimeout(()=>gate.remove(),600);beginIntro();
}
gate.addEventListener('click',openGate);

/* swipe: front envelope slides aside, then drops to the back of the stack */
function next(dir){
  if(busy)return;busy=true;
  const f=cards[cur];
  f.style.transition='transform .24s ease-out';
  f.style.transform=`translateX(${dir*62}%) rotate(${dir*7}deg)`;
  setTimeout(()=>{cur=(cur+1)%n;render();setTimeout(()=>busy=false,300)},240);
}
let sx=0,dx=0,drag=false;
function sealDrag(e){
  const c=cards[cur],s=c.querySelector('.seal'),r=s.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const ang=ev=>Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI;
  let last=ang(e),cum=0,tk=0,moved=false;
  c.classList.add('grab');s.style.transition='none';
  const mv=ev=>{
    const a=ang(ev);let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;cum+=d;if(Math.abs(d)>.5)moved=true;
    s.style.transform='translate(-50%,-50%) rotate('+cum+'deg)';
    const k=Math.floor(Math.abs(cum)/18);if(k!==tk){tk=k;tick(900,.025,.06);try{navigator.vibrate&&navigator.vibrate(6)}catch(_){}}
    if(Math.abs(cum)>=360)up(true);
  };
  const up=done=>{
    removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    c.classList.remove('grab');s.style.transition='';
    if(done===true){s.style.transform='';tick(700,.06,.12);try{navigator.vibrate&&navigator.vibrate(25)}catch(_){}showScene(cur)}
    else if(!moved){s.style.transform='';openLetter(cur)}
    else{s.style.transition='transform .5s cubic-bezier(.3,1.4,.5,1)';s.style.transform='';setTimeout(()=>s.style.transition='',600)}
  };
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
deck.addEventListener('pointerdown',e=>{
  if(!dialCard&&!busy&&!ov.classList.contains('on')&&e.target.closest&&e.target.closest('.seal')&&!lockMsg(cur)){e.preventDefault();sealDrag(e);return}
  if(dialCard){finishDial(cur);return}
  if(busy||ov.classList.contains('on'))return;
  drag=true;sx=e.clientX;dx=0;try{deck.setPointerCapture(e.pointerId)}catch(_){}
  cards[cur].style.transition='none';nudge&&nudge.cancel();
});
deck.addEventListener('pointermove',e=>{
  if(!drag)return;dx=e.clientX-sx;
  cards[cur].style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;
});
deck.addEventListener('pointerup',()=>{
  if(!drag)return;drag=false;const f=cards[cur];f.style.transition='';
  if(Math.abs(dx)>70)next(dx<0?-1:1);
  else{f.style.transform=POS[0].t;if(Math.abs(dx)<10)openLetter(cur)}
});
deck.addEventListener('pointercancel',()=>{drag=false;render()});
deck.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter(cur)}
  else if(e.key==='ArrowLeft')next(-1);else if(e.key==='ArrowRight')next(1);
});
let nudge=null;
function startNudge(){if(!reduce)nudge=cards[0].animate([{transform:POS[0].t},{transform:'translateX(-20px) rotate(-1.8deg)'},{transform:POS[0].t}],{duration:1100,delay:500,easing:'ease-in-out'})}

$('again').onclick=()=>{opened=[];save('ow_opened',opened);cards.forEach(c=>c.classList.remove('done'));renderDots()};

/* opening: flap lifts, paper rises, letter appears, then the stamp lands */
function clear(){timers.forEach(clearTimeout);timers=[]}
function showPhoto(i){
  const src=LETTERS[i].photo||photos[i];
  ph.innerHTML=src?'':'<div><span>♡</span>tap to add<br>a photo</div>';
  if(src){const im=new Image();im.src=src;im.alt='';ph.appendChild(im)}
}
function stampIt(){
  stamp.classList.add('go');
  if(letter.classList.contains('scroll')){try{stamp.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}
  timers.push(setTimeout(()=>{letter.classList.add('hit');tick(110,.22,.3);try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}},300));
}
function reveal(){
  clear();ov.classList.add('reading');$('x').focus();
  paginate();showPage(0);
}
function unlockTime(l){return new Date(/T/.test(l.unlock)?l.unlock:l.unlock+'T00:00:00')}
function fmtCd(ms){const s=Math.floor(ms/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,q=v=>String(v).padStart(2,'0');return (d?d+'d ':'')+q(h)+'h '+q(m)+'m '+q(x)+'s'}
function updateCd(){
  LETTERS.forEach((l,i)=>{
    if(!l.unlock)return;
    const ms=unlockTime(l)-Date.now(),el=cards[i].querySelector('.cd');
    if(ms>0)el.textContent=fmtCd(ms);
    else if(el.textContent){el.textContent='';renderDots();toast('A new envelope just opened ♡')}
  });
}
function lockMsg(i){
  if(PEEK)return '';
  const l=LETTERS[i];
  if(l.final&&!LETTERS.every((o,k)=>k===i||o.unlock||opened.includes(k)))return "Open the others first ♡";
  if(l.unlock){const ms=unlockTime(l)-Date.now();if(ms>0){if(l.lockNote)return l.lockNote;const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return 'Opens in '+(d?d+'d ':'')+h+'h '+m+'m'}}
  return '';
}
setInterval(updateCd,1000);updateCd();
function setupScratch(cv){
  if(cv._ok||!cv.isConnected)return;cv._ok=true;
  const row=cv.parentNode,W=row.offsetWidth,H=row.offsetHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#bfc3c9');g.addColorStop(.45,'#eef0f3');g.addColorStop(1,'#a9aeb5');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(let k=0;k<260;k++){x.fillStyle='rgba('+(k%2?'255,255,255':'120,125,135')+','+(Math.random()*.25)+')';x.fillRect(Math.random()*W,Math.random()*H,1.5,1.5)}
  x.fillStyle='rgba(60,40,50,.55)';x.font='italic 600 16px "EB Garamond",serif';x.textAlign='center';x.textBaseline='middle';x.fillText('scratch me',W/2,H/2);
  let down=false,moves=0,fin=false;
  const dot=e=>{const b=cv.getBoundingClientRect(),px=(e.clientX-b.left)*(W/b.width),py=(e.clientY-b.top)*(H/b.height);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(px,py,15,0,6.3);x.fill()};
  const frac=()=>{const d=x.getImageData(0,0,cv.width,cv.height).data;let c=0,n=0;for(let q=3;q<d.length;q+=64){n++;if(d[q]<40)c++}return c/n};
  const finish=()=>{if(fin)return;fin=true;cv._done()};
  cv.addEventListener('pointerdown',e=>{down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}dot(e);e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!down)return;dot(e);if(++moves%10===0&&frac()>.45)finish()});
  const up=()=>{if(!down)return;down=false;if(frac()>.45)finish()};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('dblclick',finish);
  cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();finish()}});
}
let dialT=[],dialCard=null;
function finishDial(i){dialT.forEach(clearTimeout);dialT=[];if(dialCard){dialCard.classList.remove('dial');dialCard=null}busy=false;showScene(i)}
function openLetter(i){
  if(dialCard||busy)return;
  const lk=lockMsg(i);if(lk){const c=cards[i];toast(lk);c.classList.remove('nope');void c.offsetWidth;c.classList.add('nope');try{navigator.vibrate&&navigator.vibrate([20,40,20])}catch(e){}return}
  if(reduce){showScene(i);return}
  busy=true;dialCard=cards[i];dialCard.classList.add('dial');
  const v=()=>{tick(900,.03,.09);try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
  dialT=[setTimeout(v,910),setTimeout(v,1580),setTimeout(v,2400),setTimeout(()=>finishDial(i),2700)];
}

/* ---- pages: every letter is split into screen-sized pages, nothing scrolls ---- */
(function(){
  const pg=document.createElement('div');pg.id='pgwrap';pg.className='pgwrap';
  const head=document.createElement('div');head.id='head';head.append($('pol'),$('lt'),letter.querySelector('.orn'));
  const bodyw=document.createElement('div');bodyw.id='bodyw';bodyw.append($('lb'),$('extra'));
  const foot=document.createElement('div');foot.id='foot';foot.append($('sign'),letter.querySelector('.stampwrap'));
  pg.append(head,bodyw,foot);
  const nav=document.createElement('div');nav.id='nav';nav.className='nav';
  nav.innerHTML='<button id="pv" aria-label="Previous page">\u2039</button><span class="pdots" id="pdots"></span><button id="pn" aria-label="Next page">\u203a</button>';
  letter.append(pg,nav);
})();
function buildExtra(i,lo,hi){
  const L=LETTERS[i],ex=$('extra');ex.innerHTML='';
  if(L.coupon){const d=document.createElement('div');d.className='coupon';d.innerHTML='<b>coupon</b>';d.appendChild(document.createTextNode(L.coupon));ex.appendChild(d)}
  if(L.link){const a=document.createElement('a');a.href=L.link.url;a.target='_blank';a.rel='noopener';a.textContent=L.link.label||L.link.url;ex.appendChild(a)}
  if(L.songs){const ul=document.createElement('div');ul.className='songs';L.songs.slice(lo,hi).forEach((s,kk)=>{const k=lo+kk;const r=document.createElement(s.url?'a':'div');r.className='song';if(s.url){r.href=s.url;r.target='_blank';r.rel='noopener'}r.innerHTML='<i>♪</i><span><b></b><em></em></span>';r.querySelector('b').textContent='Track '+(k+1);r.querySelector('em').textContent='tap to play';ul.appendChild(r)});ex.appendChild(ul)}
    if(L.coupons){
    const box=document.createElement('div');box.className='wallet';
    const cool=document.createElement('p');cool.className='cool';box.appendChild(cool);
    const upd=()=>{const w=coolMs();cool.textContent=w>0?'Next coupon opens in '+fmtCd(w).replace(/ \d+s$/,''):'';if(!cool.isConnected&&cool._t)clearInterval(cool._t)};
    cool._t=setInterval(upd,20000);upd();
    L.coupons.slice(lo,hi).forEach((c,kk)=>{const k=lo+kk;
      const id=i+'-'+k,max=c.uses||1;
      const row=document.createElement('div');row.className='tkt';
      const left=document.createElement('div');left.className='tl';
      const ttl=document.createElement('b'),sub=document.createElement('em');left.appendChild(ttl);left.appendChild(sub);
      let inp=null;
      if(c.custom){inp=document.createElement('input');inp.placeholder='write what you want here…';inp.maxLength=80;left.appendChild(inp)}
      const btn=document.createElement('button');
      const used=()=>(coupState[id]&&coupState[id].n)||0;
      const paint=()=>{
        const u=used(),done=u>=max;
        ttl.textContent=c.custom?((coupState[id]&&coupState[id].text)||'Blank coupon'):c.title;
        sub.textContent=max>1?(done?'all '+max+' used':(max-u)+' of '+max+' left'):'';
        row.classList.toggle('done',done);btn.textContent='Redeem';
        if(inp)inp.style.display=done?'none':'';
      };
      let armed=null;
      btn.onclick=()=>{
        const w=coolMs();if(w>0){toast('Next coupon in '+fmtCd(w).replace(/ \d+s$/,''));return}
        if(inp&&!inp.value.trim()){inp.focus();return}
        if(!armed){btn.textContent='Tap again to confirm';armed=setTimeout(()=>{armed=null;paint()},3000);return}
        clearTimeout(armed);armed=null;
        const st=coupState[id]||{n:0};lastRedeem=Date.now();save('ow_last',lastRedeem);upd();st.n++;if(inp)st.text=inp.value.trim();coupState[id]=st;save('ow_coupons',coupState);
        tick(700,.06,.12);try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}
        paint();
        if(WHATSAPP){
          const msg='Janaa redeemed a coupon: "'+(c.custom?st.text:c.title)+'" ♡';
          const a=document.createElement('a');a.href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg);a.target='_blank';a.rel='noopener';
          document.body.appendChild(a);a.click();a.remove();
        }
      };
      row.appendChild(left);row.appendChild(btn);box.appendChild(row);paint();
      if(!(coupState[id]&&coupState[id].r)){
        const cv=document.createElement('canvas');cv.className='scr';cv.tabIndex=0;cv.setAttribute('role','button');cv.setAttribute('aria-label','Scratch to reveal this coupon');
        cv._done=()=>{const st=coupState[id]||{n:0};st.r=true;coupState[id]=st;save('ow_coupons',coupState);tick(800,.05,.1);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}cv.classList.add('gone');setTimeout(()=>cv.remove(),700)};
        row.appendChild(cv);
      }
    });
    ex.appendChild(box);
  }
  if(L.audio){const au=document.createElement('audio');au.controls=true;au.src=L.audio;ex.appendChild(au)}
  $('wax').textContent=SEAL;
}
let pages=[],pgI=0,stamped=false;
function paginate(){
  const L=LETTERS[openIdx],list=L.songs||L.coupons;stamped=false;
  if(list){pages=[{lo:0,hi:list.length}];return}
  pages=[{text:L.text||''}];
}
function showPage(pi){
  pgI=pi;const L=LETTERS[openIdx],list=L.songs||L.coupons,P=pages[pi],first=pi===0,last=pi===pages.length-1;
  $('pgwrap').scrollTop=0;
  $('head').style.display=first?'':'none';
  $('pol').style.display=(first&&!list)?'':'none';
  $('foot').style.display=last?'':'none';
  document.querySelector('.stampwrap').style.display=list?'none':'';
  const lbEl=$('lb');
  if(list){lbEl.textContent=first?(L.text||''):'';buildExtra(openIdx,P.lo,P.hi)}
  else{lbEl.textContent=P.text;if(last)buildExtra(openIdx,0,0);else $('extra').innerHTML=''}
  lbEl.style.display=lbEl.textContent?'':'none';
  $('pdots').innerHTML=pages.map((_,k)=>'<i'+(k===pi?' class="on"':'')+'></i>').join('');
  $('pv').disabled=first;$('pn').disabled=last;$('nav').classList.toggle('one',pages.length<2);
  document.querySelectorAll('.scr').forEach(setupScratch);
  try{$('pgwrap').animate([{opacity:0},{opacity:1}],{duration:350})}catch(e){}
  if(last&&!list&&!stamped){stamped=true;if(reduce)stamp.classList.add('now');else{const w=$('pgwrap');if(w._onS)w.removeEventListener('scroll',w._onS);if(w.scrollHeight>w.clientHeight+6){const onS=()=>{if(w.scrollTop+w.clientHeight>=w.scrollHeight-50){w.removeEventListener('scroll',onS);stampIt()}};w._onS=onS;w.addEventListener('scroll',onS)}else timers.push(setTimeout(stampIt,1600))}}
}
$('pn').onclick=()=>{if(pgI<pages.length-1)showPage(pgI+1)};
$('pv').onclick=()=>{if(pgI>0)showPage(pgI-1)};
let swx=null;
letter.addEventListener('pointerdown',e=>{swx=e.target.closest('.scr,button,input,a,audio')?null:e.clientX});
letter.addEventListener('pointerup',e=>{if(swx===null)return;const d=e.clientX-swx;swx=null;if(d<-50)$('pn').click();else if(d>50)$('pv').click()});
document.addEventListener('keydown',e=>{if(!ov.classList.contains('reading'))return;if(e.key==='ArrowRight')$('pn').click();else if(e.key==='ArrowLeft')$('pv').click()});
function showScene(i){
  openIdx=i;clear();
  $('lt').textContent='Open when '+LETTERS[i].label;
  const lbx=$('lb'),tx=LETTERS[i].text||'',ar=/[\u0600-\u06FF]/.test(tx);lbx.textContent=tx;lbx.dir=ar?'rtl':'ltr';lbx.classList.toggle('ar',ar);$('sign').textContent=LETTERS[i].sign||'';
  $('cap').textContent=LETTERS[i].caption||'';
  showPhoto(i);stamp.className='stamp';letter.classList.remove('hit');letter.scrollTop=0;
  if(!opened.includes(i)){opened.push(i);save('ow_opened',opened);cards[i].classList.add('done');renderDots()}
  ov.className='ov on';scene.className='scene';
  if(reduce){reveal();return}
  void scene.offsetWidth;
  timers=[setTimeout(()=>scene.classList.add('open'),250),
          setTimeout(()=>scene.classList.add('rise'),1500),
          setTimeout(reveal,3400)];
}
let closingT=null;
function hideOv(){
  clearTimeout(closingT);closingT=null;ov.className='ov';letter.classList.remove('hit');
  const c=cards[cur];c.focus();
  if(!reduce){c.classList.add('relock');setTimeout(()=>c.classList.remove('relock'),900)}
}
function closeIt(){
  if(closingT)return;clear();letter.classList.remove('hit');
  if(reduce||!ov.classList.contains('reading')){hideOv();return}
  ov.classList.add('closing');closingT=setTimeout(hideOv,950);
}
$('x').onclick=closeIt;
ov.addEventListener('click',e=>{
  if(e.target===ov){ov.classList.contains('reading')?closeIt():reveal()}
  else if(scene.contains(e.target)&&!ov.classList.contains('reading'))reveal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('on'))closeIt()});

$('pol').onclick=()=>{if(!(LETTERS[openIdx].photo||photos[openIdx]))file.click()};
$('pol').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!(LETTERS[openIdx].photo||photos[openIdx]))file.click()}};
file.onchange=()=>{
  const f=file.files[0];if(!f||openIdx===null)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    photos[openIdx]=c.toDataURL('image/jpeg',.82);save('ow_photos',photos);showPhoto(openIdx);file.value='';
  };im.src=r.result};
  r.readAsDataURL(f);
};
